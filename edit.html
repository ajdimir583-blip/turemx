{% extends "base.html" %}{% block title %}{{ 'Редактирование' if place else 'Новый объект' }}{% endblock %}
{% block content %}
<div class="form-card"><div class="breadcrumbs"><a href="{{ url_for('admin') }}">Администрирование</a> / Карточка объекта</div><h1>{{ 'Редактирование объекта' if place else 'Добавление объекта' }}</h1>
<form method="post" class="edit-form">
<label>Название *<input name="name" required maxlength="160" value="{{ place.name if place else '' }}"></label>
<label>Категория *<select name="category" required>{% for c in categories %}<option {% if place and place.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label>
<label class="full">Описание *<textarea name="description" required rows="5">{{ place.description if place else '' }}</textarea></label>
<label>Адрес / расположение<input name="address" value="{{ place.address if place else '' }}"></label>
<label>Фотография (URL)<input type="url" name="photo_url" value="{{ place.photo_url if place else '' }}" placeholder="https://..."></label>
<label>Широта<input name="latitude" type="number" step="any" value="{{ place.latitude if place and place.latitude is not none else '' }}"></label>
<label>Долгота<input name="longitude" type="number" step="any" value="{{ place.longitude if place and place.longitude is not none else '' }}"></label>
<label>Контакты<input name="contact" value="{{ place.contact if place else '' }}"></label>
<label>Стоимость<input name="price" value="{{ place.price if place else '' }}" placeholder="Бесплатно / 500 ₽ / уточнять"></label>
<label>Расстояние от Якутска, км<input name="distance_km" type="number" min="0" step="any" value="{{ place.distance_km if place and place.distance_km is not none else '' }}"></label>
<label>Сезонность<select name="season">{% for s in seasons %}<option {% if place and place.season==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
<label>Сайт / ссылка для уточнения<input type="url" name="website" value="{{ place.website if place else '' }}" placeholder="https://..."></label>
<div class="check-row"><label><input type="checkbox" name="family_friendly" value="1" {% if place and place.family_friendly %}checked{% endif %}> Подходит для семей с детьми</label><label><input type="checkbox" name="published" value="1" {% if not place or place.published %}checked{% endif %}> Опубликовать</label></div>
<div class="form-actions"><button class="btn" type="submit">Сохранить</button><a class="btn btn-outline" href="{{ url_for('admin') }}">Отмена</a></div>
</form></div>
{% endblock %}
